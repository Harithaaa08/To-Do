<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do App</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f5f5f5;
      min-height: 100vh;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .navbar {
      width: 240px;
      flex-shrink: 0;
      background-color: #ece4e5;
      border-right: 1px solid #d9cece;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-title {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0 16px 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      cursor: pointer;
      font-size: 14px;
      color: #555;
      position: relative;
      transition: background 0.15s;
    }

    .nav-item:hover {
      background: rgba(0, 0, 0, 0.05);
      color: #222;
    }

    .nav-item.active {
      background: rgba(0, 0, 0, 0.07);
      color: #222;
      font-weight: 600;
    }

    .nav-item.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: rgb(217, 91, 91);
      border-radius: 0 2px 2px 0;
    }

    .nav-item i {
      font-size: 17px;
      color: #888;
    }

    .nav-item.active i {
      color: rgb(217, 91, 91);
    }

    .nav-badge {
      margin-left: auto;
      font-size: 11px;
      background: rgba(0, 0, 0, 0.1);
      color: #555;
      border-radius: 10px;
      padding: 1px 7px;
      min-width: 20px;
      text-align: center;
    }

    .nav-divider {
      height: 1px;
      background: #d9cece;
      margin: 8px 16px;
    }

    .main {
      flex: 1;
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .view-title {
      font-size: 22px;
      font-weight: 600;
      color: #222;
    }

    .add-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      background: rgb(217, 91, 91);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition:
        background 0.2s,
        transform 0.15s;
    }

    .add-btn:hover {
      background: rgb(190, 60, 60);
      transform: scale(1.04);
    }

    .add-btn i {
      font-size: 16px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      max-width: 480px;
    }

    .input-row input {
      flex: 1;
      padding: 10px 16px;
      border: 2px solid #ccc;
      border-radius: 30px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus {
      border-color: rgb(217, 91, 91);
    }

    .input-row button {
      padding: 10px 22px;
      background: rgb(217, 91, 91);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-row button:hover {
      background: rgb(190, 60, 60);
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 560px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: white;
      border: 1px solid #e8e0e0;
      border-radius: 12px;
      transition:
        border-color 0.15s,
        box-shadow 0.15s;
    }

    .task-item:hover {
      border-color: #ccc;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    .task-item input[type="checkbox"] {
      accent-color: rgb(217, 91, 91);
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      font-size: 15px;
      color: #222;
    }

    .task-text.done {
      text-decoration: line-through;
      color: #aaa;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #bbb;
      font-size: 16px;
      display: flex;
      align-items: center;
      padding: 2px;
      opacity: 0;
      transition:
        opacity 0.15s,
        color 0.15s;
    }

    .task-item:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      color: #e24b4a;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: #aaa;
      font-size: 14px;
    }

    .empty-state i {
      font-size: 36px;
      display: block;
      margin-bottom: 10px;
      opacity: 0.4;
    }
  </style>
  <body>
    <div class="app">
      <nav class="navbar">
        <span class="nav-title">Views</span>
        <div
          class="nav-item active"
          data-view="all"
          onclick="switchView('all')"
        >
          <i class="ti ti-list"></i> All tasks
          <span class="nav-badge" id="badge-all">0</span>
        </div>
        <div
          class="nav-item"
          data-view="pending"
          onclick="switchView('pending')"
        >
          <i class="ti ti-circle-dashed"></i> To do
          <span class="nav-badge" id="badge-pending">0</span>
        </div>
        <div
          class="nav-item"
          data-view="completed"
          onclick="switchView('completed')"
        >
          <i class="ti ti-circle-check"></i> Completed
          <span class="nav-badge" id="badge-completed">0</span>
        </div>
        <div class="nav-divider"></div>
        <span class="nav-title">Actions</span>
        <div class="nav-item" onclick="clearCompleted()">
          <i class="ti ti-trash"></i> Clear completed
        </div>
      </nav>

      <main class="main">
        <div class="top-bar">
          <h1 class="view-title" id="view-title">All tasks</h1>
          <button class="add-btn" onclick="toggleInput()">
            <i class="ti ti-plus"></i> Add task
          </button>
        </div>
        <div class="input-row" id="input-row" style="display: none">
          <input
            type="text"
            id="taskInput"
            placeholder="What needs to be done?"
            onkeydown="if (event.key === 'Enter') addTask();"
          />
          <button onclick="addTask()">Add</button>
        </div>
        <div class="task-list" id="task-list"></div>
      </main>
    </div>
  </body>

  <script>
    let tasks = [];
    let currentView = "all";
    let inputVisible = false;

    const viewLabels = {
      all: "All tasks",
      pending: "To do",
      completed: "Completed",
    };

    const emptyMessages = {
      all: "No tasks yet — add one above",
      pending: "Nothing left to do!",
      completed: "No completed tasks yet",
    };

    const emptyIcons = {
      all: "ti-clipboard-list",
      pending: "ti-circle-check",
      completed: "ti-trophy",
    };

    function toggleInput() {
      inputVisible = !inputVisible;
      document.getElementById("input-row").style.display = inputVisible
        ? "flex"
        : "none";
      if (inputVisible) document.getElementById("taskInput").focus();
    }

    function addTask() {
      const input = document.getElementById("taskInput");
      const text = input.value.trim();
      if (!text) {
        alert("Please enter a task!");
        return;
      }
      tasks.push({ id: Date.now(), text, done: false });
      input.value = "";
      render();
    }

    function toggleTask(id) {
      const task = tasks.find((t) => t.id === id);
      if (task) task.done = !task.done;
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter((t) => t.id !== id);
      render();
    }

    function clearCompleted() {
      tasks = tasks.filter((t) => !t.done);
      render();
    }

    function switchView(view) {
      currentView = view;
      document.querySelectorAll(".nav-item[data-view]").forEach((el) => {
        el.classList.toggle("active", el.dataset.view === view);
      });
      document.getElementById("view-title").textContent = viewLabels[view];
      render();
    }

    function render() {
      const pending = tasks.filter((t) => !t.done).length;
      const completed = tasks.filter((t) => t.done).length;

      document.getElementById("badge-all").textContent = tasks.length;
      document.getElementById("badge-pending").textContent = pending;
      document.getElementById("badge-completed").textContent = completed;

      const visible = tasks.filter((t) =>
        currentView === "all"
          ? true
          : currentView === "pending"
            ? !t.done
            : t.done,
      );

      const list = document.getElementById("task-list");

      if (visible.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <i class="ti ${emptyIcons[currentView]}"></i>
            ${emptyMessages[currentView]}
          </div>`;
        return;
      }

      list.innerHTML = visible
        .map(
          (t) => `
        <div class="task-item">
          <input
            type="checkbox"
            ${t.done ? "checked" : ""}
            onchange="toggleTask(${t.id})"
          />
          <span class="task-text ${t.done ? "done" : ""}">${t.text}</span>
          <button class="delete-btn" onclick="deleteTask(${t.id})" title="Delete task">
            <i class="ti ti-x"></i>
          </button>
        </div>
      `,
        )
        .join("");
    }

    render();
  </script>
</html>
